<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hollow++ overlay</title>
<style>
:root{
  --ink:#f0f0f0; --ink2:#c4c4c4; --mute:#8a8a8a; --dim:#5a5a5a;
  --line:rgba(255,255,255,.11);
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,Consolas,"Courier New",monospace;
  --ez:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent;overflow:hidden;user-select:none;cursor:default}
body{color:var(--ink);font:12px/1.4 var(--sans);-webkit-font-smoothing:antialiased;padding:6px}
.card{background:rgba(8,8,8,.72);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 11px var(--mono);color:var(--ink2);letter-spacing:.04em}
.hd small{color:var(--mute);font-weight:400}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{font:12px var(--mono);color:var(--ink2);flex:none}
.mate .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none;margin-right:6px}
.mate.dead{color:var(--dim)}
.mate.dead .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--dim)}
.mate.off{opacity:.55}
.mate .l{display:flex;align-items:center;min-width:0}
.ev.urgent .t{color:var(--ink);font-weight:700}
.ev.done{opacity:.45}
.bar{height:2px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink2);transform-origin:left;transition:transform .28s var(--ez)}
.al{border-left:2px solid var(--dim);padding:3px 8px;margin-top:4px;transition:opacity .6s linear;animation:in .28s var(--ez)}
.al.p-med{border-left-color:var(--ink2)}
.al.p-high{border-left-color:var(--ink);background:rgba(255,255,255,.07)}
.al b{display:block;font-weight:600}
.al span{color:var(--mute)}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="card" id="cSrv" hidden>
  <div class="hd"><span id="srvName">—</span><small id="srvOn"></small></div>
  <div class="row"><span style="color:var(--mute)" id="wipeL">wipe</span><span class="t" id="wipeT">—</span></div>
</div>
<div class="card" id="cTeam" hidden>
  <div class="hd"><span id="teamL">team</span><small id="teamCnt"></small></div>
  <div id="team"></div>
</div>
<div class="card" id="cEv" hidden>
  <div class="hd"><span id="evL">events</span></div>
  <div id="evs"></div>
</div>
<div id="alerts"></div>
<script>
(function () {
  "use strict";
  var ru = /^ru/i.test(navigator.language || "ru");
  var T = ru ? {
    wipe: "до вайпа", team: "Пачка", events: "Ивенты", gone: "—", d: "д",
    evCargo: "Карго", evHeli: "Патрулька", evChinook: "Чинук"
  } : {
    wipe: "until wipe", team: "Team", events: "Events", gone: "—", d: "d",
    evCargo: "Cargo ship", evHeli: "Patrol helicopter", evChinook: "Chinook"
  };
  var $ = function (id) { return document.getElementById(id); };
  var tt = function (k) { return Object.prototype.hasOwnProperty.call(T, k) ? T[k] : String(k); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  $("wipeL").textContent = tt("wipe"); $("teamL").textContent = tt("team"); $("evL").textContent = tt("events");

  var server = { name: "", online: null, max: null, wipeEnd: 0 };
  var team = [];
  var evs = [];   // [key, status, endMs, total]
  var alerts = []; // {ts, prio, title, text, el}

  var fmt = function (s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

  function renderServer() {
    var has = !!(server.name || server.online != null);
    $("cSrv").hidden = !has;
    $("srvName").textContent = server.name || "—";
    $("srvOn").textContent = server.online == null ? "" : server.online + "/" + (server.max == null ? "—" : server.max);
    var left = server.wipeEnd ? Math.max(0, Math.round((server.wipeEnd - Date.now()) / 1000)) : null;
    if (left == null) { $("wipeT").textContent = "—"; return; }
    var d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600), m = Math.floor(left % 3600 / 60);
    $("wipeT").textContent = d + tt("d") + " " + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }
  function renderTeam() {
    $("cTeam").hidden = !team.length;
    $("teamCnt").textContent = team.length ? team.filter(function (m) { return m.alive; }).length + "/" + team.length : "";
    $("team").innerHTML = team.map(function (m) {
      return '<div class="row mate ' + (m.alive ? "" : "dead") + (m.online === false ? " off" : "") + '"><span class="l"><i class="dot"></i><b>' +
        esc(m.n) + "</b></span></div>";
    }).join("");
  }
  function renderEv() {
    var now = Date.now();
    $("cEv").hidden = !evs.length;
    $("evs").innerHTML = evs.map(function (e) {
      var left = Math.max(0, Math.ceil((e[2] - now) / 1000));
      var f = left <= 0 ? 0 : Math.max(0, Math.min(1, 1 - left / e[3]));
      return '<div class="ev ' + (left > 0 && left < 180 ? "urgent " : "") + (left <= 0 ? "done" : "") + '"><div class="row"><b>' +
        esc(tt(e[0])) + '</b><span class="t">' + (left <= 0 ? tt("gone") : fmt(left)) + '</span></div><div class="bar"><i style="transform:scaleX(' +
        f.toFixed(3) + ')"></i></div></div>';
    }).join("");
  }
  function renderAlerts() {
    var host = $("alerts"), now = Date.now();
    alerts = alerts.filter(function (a) { return now - a.ts < 20000; }).slice(0, 3);
    var html = alerts.map(function (a) {
      var age = now - a.ts;
      var op = age < 12000 ? 1 : Math.max(0, 1 - (age - 12000) / 8000);
      return '<div class="al p-' + a.prio + '" style="opacity:' + op.toFixed(2) + '"><b>' + esc(a.title) + "</b>" +
        (a.text ? "<span>" + esc(a.text) + "</span>" : "") + "</div>";
    }).join("");
    if (host._h !== html) { host._h = html; host.innerHTML = html; }
  }

  function setServer(p) { Object.assign(server, p || {}); renderServer(); }
  function setTeam(list) { team = Array.isArray(list) ? list : []; renderTeam(); }
  function setEvents(list) {
    evs = (Array.isArray(list) ? list : []).map(function (e) {
      var left = Math.max(0, e.left | 0);
      return [e.key, e.status || "", Date.now() + left * 1000, Math.max(left, e.total | 0) || 1];
    });
    renderEv();
  }
  function onAlert(p) {
    if (!p) return;
    var prio = p.prio === "high" || p.prio === "med" ? p.prio : "low";
    var title = String(p.title || ""), text = String(p.text || "");
    alerts.unshift({ ts: Date.now(), prio: prio, title: title || text, text: title ? text : "" });
    alerts.length = Math.min(alerts.length, 3);
    renderAlerts();
  }

  setInterval(function () { renderEv(); renderServer(); }, 1000);
  setInterval(renderAlerts, 1000);

  try {
    if (window.__TAURI__ && window.__TAURI__.event) {
      var on = function (name, fn) { window.__TAURI__.event.listen(name, function (e) { try { fn(e.payload); } catch (x) {} }); };
      on("server_info", setServer); on("team_info", setTeam); on("events", setEvents); on("alert", onAlert);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
