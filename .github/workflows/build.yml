name: build-windows

on:
  workflow_dispatch:        # ручной запуск: вкладка Actions -> build-windows -> Run workflow
  push:
    tags: ["v*"]            # или тег вида v0.1.0

permissions:
  contents: write           # публикация релиза для автообновления

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set version
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $c.version = $env:VERSION
          [IO.File]::WriteAllText("$PWD/src-tauri/tauri.conf.json", ($c | ConvertTo-Json -Depth 20))
          $t = Get-Content src-tauri/Cargo.toml -Raw
          $t = [regex]::Replace($t, '(?m)^version = "[^"]*"', "version = `"$env:VERSION`"", 1)
          [IO.File]::WriteAllText("$PWD/src-tauri/Cargo.toml", $t)

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build

      - name: Prepare release files
        shell: pwsh
        run: |
          $b = Get-ChildItem -Recurse -Path src-tauri/target/release/bundle/nsis, target/release/bundle/nsis -Filter *-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $b) { throw "installer not found" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $b.FullName out/hollow-setup.exe
          Copy-Item "$($b.FullName).sig" out/hollow-setup.exe.sig
          $notes = (git log -1 --pretty=%s)
          $latest = [ordered]@{
            version = $env:VERSION
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{
              signature = (Get-Content out/hollow-setup.exe.sig -Raw).Trim()
              url = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/hollow-setup.exe"
            } }
          }
          [IO.File]::WriteAllText("$PWD/out/latest.json", ($latest | ConvertTo-Json -Depth 10))
          [IO.File]::WriteAllText("$PWD/out/notes.txt", $notes)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VERSION" out/hollow-setup.exe out/hollow-setup.exe.sig out/latest.json --target "${{ github.sha }}" --title "hollow++ $env:VERSION" --notes-file out/notes.txt --latest

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hollow-installer
          path: out/hollow-setup.exe
          if-no-files-found: error
